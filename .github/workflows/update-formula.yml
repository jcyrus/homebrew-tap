name: Update Formula

on:
  repository_dispatch:
    types: [update-formula]

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Update Formula
        run: |
          PROJECT="${{ github.event.client_payload.project }}"
          VERSION="${{ github.event.client_payload.version }}"
          # Strip 'v' prefix
          CLEAN_VERSION="${VERSION#v}"

          echo "Updating $PROJECT to $VERSION ($CLEAN_VERSION)..."

          FILE=""
          if [ "$PROJECT" == "browserport" ]; then
             FILE="Casks/$PROJECT.rb"
          else
             FILE="Formula/$PROJECT.rb"
          fi

          if [ ! -f "$FILE" ]; then
            echo "Error: $FILE does not exist"
            exit 1
          fi

          export FILE CLEAN_VERSION

          python3 - <<'PY'
          import hashlib
          import os
          import re
          from urllib.request import urlopen

          file_path = os.environ["FILE"]
          version = os.environ["CLEAN_VERSION"]

          with open(file_path, "r", encoding="utf-8") as f:
            lines = f.readlines()

          version_pattern = re.compile(r'^(\s*version\s+")[^"]+(".*)$')
          url_pattern = re.compile(r'^(\s*url\s+")([^"]+)(".*)$')
          sha_pattern = re.compile(r'^(\s*sha256\s+")[^"]+(".*)$')
          arch_sha_pattern = re.compile(r'^([ \t]*)sha256\s+arm:\s*"[^"]*",\s*$')
          arch_intel_pattern = re.compile(r'^[ \t]*intel:\s*"[^"]*"\s*$')
          arch_pattern = re.compile(r'^\s*arch\s+arm:\s*"([^"]*)",\s*intel:\s*"([^"]*)"')


          def sha256_for_url(url: str) -> str:
            print(f"Resolving sha256: {url}")
            digest = hashlib.sha256()
            with urlopen(url) as response:
              while True:
                chunk = response.read(1024 * 1024)
                if not chunk:
                  break
                digest.update(chunk)
            return digest.hexdigest()


          def resolve(template: str) -> str:
            return template.replace("#{version}", version).replace("$version", version)


          # Casks that ship per-architecture builds declare `arch arm:, intel:` and
          # interpolate #{arch} into a single url, with one sha256 per slice.
          arch_map = None
          for line in lines:
            am = arch_pattern.match(line)
            if am:
              arch_map = (am.group(1), am.group(2))
              break

          # Index every url line up front. sha256 may legitimately appear *before* url:
          # formulae put url first, casks put sha256 first. Keying off line order alone
          # silently skipped the cask checksum, leaving a stale hash behind.
          url_lines = [i for i, line in enumerate(lines) if url_pattern.match(line)]

          current_url = None
          updated_lines = []
          skip_next_intel = False

          for index, line in enumerate(lines):
            if skip_next_intel and arch_intel_pattern.match(line):
              skip_next_intel = False
              continue

            vm = version_pattern.match(line)
            if vm:
              line = f'{vm.group(1)}{version}{vm.group(2)}\n'

            um = url_pattern.match(line)
            if um:
              current_url = resolve(um.group(2))

            asm = arch_sha_pattern.match(line)
            if asm and arch_map:
              template = current_url
              if template is None:
                nxt = next((j for j in url_lines if j > index), None)
                if nxt is not None:
                  template = resolve(url_pattern.match(lines[nxt]).group(2))
              if template is None:
                raise SystemExit(f"No url found to resolve sha256 in {file_path}")
              indent = asm.group(1)
              arm_sha = sha256_for_url(template.replace("#{arch}", arch_map[0]))
              intel_sha = sha256_for_url(template.replace("#{arch}", arch_map[1]))
              updated_lines.append(f'{indent}sha256 arm:   "{arm_sha}",\n')
              updated_lines.append(f'{indent}       intel: "{intel_sha}"\n')
              skip_next_intel = True
              continue

            sm = sha_pattern.match(line)
            if sm:
              template = current_url
              if template is None:
                # Cask layout: sha256 precedes url. Look ahead for the url it belongs to.
                nxt = next((j for j in url_lines if j > index), None)
                if nxt is not None:
                  template = resolve(url_pattern.match(lines[nxt]).group(2))
              if template is not None:
                line = f'{sm.group(1)}{sha256_for_url(template)}{sm.group(2)}\n'

            updated_lines.append(line)

          with open(file_path, "w", encoding="utf-8") as f:
            f.writelines(updated_lines)
          PY

          echo "Updated $FILE"
          cat "$FILE"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          git diff --cached --quiet && exit 0
          git commit -m "Update $PROJECT to $VERSION"
          git push
